<!doctype html>
<!--
  wiggle-badge: an app icon drops in with a squash-and-stretch bounce
  (GSAP CustomBounce), a notification badge pops and counts up, then the icon
  rings like a bell (GSAP CustomWiggle).

  Variables:
    - count (number): the number the badge counts up to.
    - label (string): pill under the icon; empty hides it.
    - glyph (bell | chat | heart | cart, default bell): the icon's symbol.
    - exit (none | fade, default none).

  Timing: drop and bounce 0–1.1s, badge at 1.15s, rings at 1.75s and 2.95s,
  then holds. Shorter clips compress everything evenly.

  Moves use percentages of the elements' own size, so nothing is measured.
-->
<html
  lang="en"
  data-composition-id="wiggle-badge"
  data-composition-duration="4"
  data-composition-variables='[
    { "id": "count", "type": "number", "role": "content", "label": "Count", "description": "Number the badge counts up to.", "default": 12, "min": 1, "max": 999, "step": 1 },
    { "id": "label", "type": "string", "role": "content", "label": "Label", "description": "Pill under the icon. Empty hides it.", "default": "12 new orders" },
    { "id": "glyph", "type": "enum", "role": "style", "label": "Glyph", "description": "Symbol on the icon.", "default": "bell", "options": [{ "value": "bell", "label": "Bell" }, { "value": "chat", "label": "Chat" }, { "value": "heart", "label": "Heart" }, { "value": "cart", "label": "Cart" }] },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds until the cut.", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Wiggle Badge</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="wiggle-badge" data-duration="4" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f4f1ea);
            font-family: var(--font-display, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif);
            pointer-events: none;
          }
          .wb-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: var(--bg, #0c0d0f);
          }
          .wb-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: min(6cqh, 9cqw);
          }
          .wb-drop,
          .wb-tilt {
            position: relative;
            width: min(40cqw, 26cqh);
            aspect-ratio: 1;
          }
          .wb-tilt {
            width: 100%;
            transform-origin: 50% 8%;
          }
          .wb-icon {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            border-radius: 23%;
            background: var(--accent, #ff6a3d);
            box-shadow:
              0 2cqh 6cqh color-mix(in srgb, var(--accent, #ff6a3d) 30%, transparent),
              inset 0 -1.2cqh 2.4cqh color-mix(in srgb, #000000 18%, transparent);
            transform-origin: 50% 100%;
          }
          .wb-icon svg {
            width: 52%;
            height: 52%;
            fill: var(--fg, #f4f1ea);
          }
          .wb-badge {
            position: absolute;
            top: -9%;
            right: -9%;
            display: grid;
            place-items: center;
            min-width: 36%;
            height: 36%;
            padding: 0 6%;
            border-radius: 999px;
            border: max(3px, 0.6cqmin) solid var(--bg, #0c0d0f);
            background: var(--badge, #ff2d55);
            color: #ffffff;
            font-size: min(7cqw, 4.6cqh);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
          }
          .wb-label {
            margin: 0;
            padding: min(1.6cqh, 2.4cqw) min(4cqh, 6cqw);
            border-radius: 999px;
            border: max(2px, 0.25cqmin) solid color-mix(in srgb, var(--fg, #f4f1ea) 16%, transparent);
            background: color-mix(in srgb, var(--fg, #f4f1ea) 7%, transparent);
            font-size: min(6cqw, 4cqh);
            font-weight: 700;
            letter-spacing: -0.02em;
            white-space: nowrap;
          }
        </style>

        <div id="wiggle-badge-clip" class="wb-clip clip" data-start="0" data-duration="4" data-track-index="0">
          <div class="wb-stage">
            <div class="wb-drop">
              <div class="wb-tilt">
                <div class="wb-icon">
                  <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M0 0" /></svg>
                </div>
                <div class="wb-badge">0</div>
              </div>
            </div>
            <p class="wb-label"></p>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomBounce.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomWiggle.min.js"></script>
        <script>
          (function () {
            "use strict";
            gsap.registerPlugin(CustomEase, CustomBounce, CustomWiggle);
            CustomBounce.create("wb-bounce", { strength: 0.5, squash: 2.4, squashID: "wb-bounce-squash" });
            CustomWiggle.create("wb-ring", { wiggles: 7, type: "easeOut" });

            var root = document.getElementById("root");
            var stage = root.querySelector(".wb-stage");
            var drop = root.querySelector(".wb-drop");
            var tilt = root.querySelector(".wb-tilt");
            var icon = root.querySelector(".wb-icon");
            var glyphPath = root.querySelector(".wb-icon path");
            var badge = root.querySelector(".wb-badge");
            var label = root.querySelector(".wb-label");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var GLYPHS = {
              bell: "M50,6 C66,6 76,18 76,34 L76,56 L88,72 L12,72 L24,56 L24,34 C24,18 34,6 50,6 Z M38,78 L62,78 C62,85 56.6,92 50,92 C43.4,92 38,85 38,78 Z",
              chat: "M18,12 L82,12 C88.6,12 94,17.4 94,24 L94,62 C94,68.6 88.6,74 82,74 L46,74 L24,92 L27,74 L18,74 C11.4,74 6,68.6 6,62 L6,24 C6,17.4 11.4,12 18,12 Z",
              heart: "M50,90 C50,90 6,63 6,33 C6,18 18,7 32,7 C40,7 46,11 50,18 C54,11 60,7 68,7 C82,7 94,18 94,33 C94,63 50,90 50,90 Z",
              cart: "M4,10 L20,10 L30,62 L82,62 L94,24 L26,24 L24,14 Z M36,72 A8,8 0 1 1 36,88 A8,8 0 1 1 36,72 Z M74,72 A8,8 0 1 1 74,88 A8,8 0 1 1 74,72 Z",
            };
            var glyph = Object.prototype.hasOwnProperty.call(GLYPHS, vars.glyph) ? vars.glyph : "bell";
            var count = Math.max(1, Math.min(999, Math.round(Number(vars.count == null ? 12 : vars.count)) || 1));
            var labelText = vars.label == null ? "12 new orders" : String(vars.label);
            var exit = vars.exit === "fade" ? "fade" : "none";

            glyphPath.setAttribute("d", GLYPHS[glyph]);
            label.textContent = labelText;
            if (labelText === "") label.style.display = "none";

            var BASE = 3.85;
            var OUT_BASE = exit === "fade" ? 0.45 : 0;
            var duration = Math.max(0.001, parseFloat(root.dataset.duration || "4"));
            var k = Math.min(1, duration / (BASE + OUT_BASE));
            var OUT = OUT_BASE * k;

            gsap.set(drop, { yPercent: -260, opacity: 0 });
            gsap.set(badge, { scale: 0 });
            gsap.set(label, { opacity: 0, yPercent: 50 });

            var tl = gsap.timeline({ paused: true });
            tl.to(drop, { opacity: 1, duration: 0.2 * k, ease: "power1.out" }, 0);
            tl.to(drop, { yPercent: 0, duration: 1.1 * k, ease: "wb-bounce" }, 0);
            tl.to(icon, { scaleX: 1.22, scaleY: 0.8, duration: 1.1 * k, ease: "wb-bounce-squash" }, 0);
            tl.to(badge, { scale: 1, duration: 0.45 * k, ease: "back.out(2.4)" }, 1.15 * k);

            var counter = { value: 0 };
            tl.to(
              counter,
              {
                value: count,
                duration: 0.55 * k,
                ease: "power2.out",
                onUpdate: function () {
                  badge.textContent = String(Math.round(counter.value));
                },
              },
              1.2 * k,
            );
            tl.to(label, { opacity: 1, yPercent: 0, duration: 0.5 * k, ease: "power2.out" }, 1.35 * k);
            tl.to(tilt, { rotation: 16, duration: 0.95 * k, ease: "wb-ring" }, 1.75 * k);
            tl.to(tilt, { rotation: 9, duration: 0.8 * k, ease: "wb-ring" }, 2.95 * k);

            if (exit === "fade") {
              tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, duration - OUT);
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["wiggle-badge"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
